name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Lint
        run: python -m ruff check .

      - name: Compile source and tests
        run: python -m compileall -q src tests packaging

      - name: Check dependencies
        run: python -m pip check

      - name: Test
        run: python -m pytest

      - name: Build desktop EXE
        shell: powershell
        run: .\scripts\Build-DesktopExe.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalDoc-Windows
          path: |
            dist\LocalDoc\**
            dist\LocalDoc-Windows.zip
            dist\LocalDoc.exe.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist\LocalDoc-Windows.zip `
            dist\LocalDoc.exe.sha256 `
            --title "LocalDoc Markdown $env:GITHUB_REF_NAME" `
            --notes "Windows desktop build for LocalDoc Markdown. Extract the ZIP and run LocalDoc.exe. Tesseract OCR must be installed separately for image OCR. SHA256 checksum is attached."
