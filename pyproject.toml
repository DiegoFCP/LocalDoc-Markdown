[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localdoc-markdown"
version = "0.2.0"
description = "Local Windows desktop app for converting private documents to Markdown with optional Tesseract OCR."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook]==0.1.7",
    "PySide6>=6.11,<6.12",
    "pillow>=12,<13",
    "pytesseract>=0.3.13,<0.4",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.22,<7"]
dev = [
    "pytest>=9,<10",
    "pytest-qt>=4,<5",
    "ruff>=0.14,<0.17",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["localdoc*", "localdoc_markdown*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
