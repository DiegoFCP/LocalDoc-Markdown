[project]
name = "markitdown-workbench"
version = "0.1.0"
description = "Local desktop, Streamlit, and pipeline tools around Microsoft MarkItDown with optional Tesseract OCR."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook,audio-transcription,az-doc-intel,az-content-understanding]==0.1.6",
    "pillow>=12.2.0",
    "pytesseract>=0.3.13",
    "streamlit>=1.58.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.20.0"]

[tool.ruff]
line-length = 100
