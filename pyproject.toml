[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localdoc-markdown"
version = "0.1.2"
description = "Local desktop, Streamlit, and pipeline tools around Microsoft MarkItDown with optional Tesseract OCR."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook,audio-transcription,az-doc-intel,az-content-understanding]==0.1.6",
    "pillow>=12.2.0",
    "pytesseract>=0.3.13",
    "streamlit>=1.58.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.20.0"]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["localdoc_markdown*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
